        - generic [ref=e164]:
          - heading "Open source, open books" [level=2] [ref=e165]
          - paragraph [ref=e166]: Dasho is free software under MIT OR Apache-2.0. The whole thing lives on GitHub, the transfer engine is a separate crate you can read, and nothing about it phones home. You don’t have to take our word for any of that; the code is right there.
          - link "Read the source" [ref=e167] [cursor=pointer]:
            - /url: https://github.com/dashoapp/dasho
        - list [ref=e168]:
          - listitem [ref=e169]:
            - heading "No cloud" [level=3] [ref=e170]
            - paragraph [ref=e171]: Transfers go device to device over your own networks. There is no server in the middle, because there is no server.
          - listitem [ref=e172]:
            - heading "No accounts" [level=3] [ref=e173]
            - paragraph [ref=e174]: Install, open, send. No sign-up, no email, no friends list to rebuild.
          - listitem [ref=e175]:
            - heading "No telemetry" [level=3] [ref=e176]
            - paragraph [ref=e177]: Nothing reports back, ever. The network tab is boring, and you can verify that yourself.
