      - heading "Files that move" [level=1] [ref=e15]: Files that move.
      - paragraph [ref=e16]: 40 GB of trip pics, the whole semester folder, tonight’s 12 GB render. Dasho sends it all straight to the device next to you at local-network speed. No cloud, no size limits, no accounts.
