    - region [ref=e33]:
      - generic [ref=e34]:
        - heading "Not another sharing app" [level=2] [ref=e35]
        - paragraph [ref=e36]: "Simple local sharing is a solved problem. Dasho is built for the transfers that hurt: huge, flaky, cross-network, or no app on the other end."
        - generic [ref=e37]:
          - article [ref=e38]:
            - generic [ref=e39]:
              - heading "Speed, with receipts" [level=3] [ref=e40]
              - paragraph [ref=e41]: One stream is how other apps crawl through a Wi-Fi link. Dasho opens many in parallel, packs small files into batches, and skips bytes it has already sent. The benchmark harness that proves it ships with the engine, so every speed claim can be rerun.
          - article [ref=e44]:
            - generic [ref=e45]:
              - heading "A transfer that refuses to die" [level=3] [ref=e46]
              - paragraph [ref=e47]: Close the lid, lose the Wi-Fi, reboot halfway through. Dasho picks up from the exact byte where it stopped, across sleeps, network switches, and restarts. Every file ends with a checksum receipt, so what landed is what left.
            - img [aria-hidden] [ref=e49]:
              - generic [ref=e52]: sleep
              - generic [ref=e53]: network switch
          - article [ref=e54]:
            - generic [ref=e55]:
              - heading "Your devices, one mesh" [level=3] [ref=e56]
              - paragraph [ref=e57]: Pair your laptop, desktop, and the rest once and they stay connected, across the room or across networks. No cables, no uploads, no cloud sitting in the middle of your own files.
          - article [ref=e69]:
            - generic [ref=e70]:
              - heading "They don’t need to install anything" [level=3] [ref=e71]
              - paragraph [ref=e72]: Sending to someone without Dasho? Show them a QR code and their browser becomes the receiver. Files still arrive verified, byte for byte. There’s also a portable single-file build that runs off a USB stick.
    - region [ref=e100]:
      - generic [ref=e101]:
        - heading "Three steps, zero setup" [level=2] [ref=e102]
        - paragraph [ref=e103]: No accounts to make, no rooms to join, no six-digit codes read aloud across the desk.
        - list [ref=e104]:
          - listitem [ref=e105]:
            - generic [aria-hidden] [ref=e106]: "1"
            - generic [ref=e107]:
              - heading "Install the app" [level=3] [ref=e108]
              - paragraph [ref=e109]: A few megabytes on Windows, macOS, or Linux. No account, no setup wizard, no restart.
          - listitem [ref=e110]:
            - generic [aria-hidden] [ref=e111]: "2"
            - generic [ref=e112]:
              - heading "Point it at the other device" [level=3] [ref=e113]
              - paragraph [ref=e114]: Devices on your network show up on their own. Somewhere else? Pair once and the mesh handles the rest.
          - listitem [ref=e115]:
            - generic [aria-hidden] [ref=e116]: "3"
            - generic [ref=e117]:
              - heading "Send, then watch it land" [level=3] [ref=e118]
              - paragraph [ref=e119]: Pick your files and hit send. Progress per file, then a receipt that says every byte checked out.
    - region [ref=e120]:
      - generic [ref=e121]:
        - heading "Fastest is a claim. Here come the numbers." [level=2] [ref=e122]
        - paragraph [ref=e123]: "The benchmark harness is being built alongside the engine, because a speed claim without a rerunnable test is just marketing. When v1 ships, this section gets published results: Dasho against LocalSend and scp, across three scenarios."
        - list [ref=e124]:
          - listitem [ref=e125]:
