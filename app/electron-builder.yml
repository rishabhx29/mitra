# electron-builder config for Mitra (plan Task F). Produced by `npm run dist`
# (= electron-vite build && electron-builder --win portable) into dist/.
#
# The main process externalizes its deps (externalizeDepsPlugin in
# electron.vite.config.ts), so out/main/index.js still requires express at runtime —
# electron-builder always packs package.json + production dependencies in addition to
# the `files` patterns below, so no node_modules entry is needed here.
appId: com.bolnabuildathon.mitra
productName: Mitra
copyright: Copyright © 2026 Mitra Team

directories:
  output: dist
  buildResources: build # optional icon goes here (build/icon.ico); defaults are used when absent

files:
  - out/** # built main + preload + renderer (electron-vite output)
  - assets/** # bundled sample VRM (assets/avatars/Seed-san.vrm) — read from inside the asar by mitra:set-avatar-file
  - package.json
  - '!**/*.map'

asar: true

win:
  # Portable single-exe target — the buildathon demo artifact. Unsigned on purpose:
  # no code-signing certificate is configured; SmartScreen may warn on first run.
  target:
    - target: portable
      arch:
        - x64

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

# Optional NSIS installer extra (not built by `npm run dist`; run explicitly with
# `npx electron-builder --win nsis` after uncommenting):
# nsis:
#   oneClick: true
#   perMachine: false
#   artifactName: ${productName}-Setup-${version}.${ext}
